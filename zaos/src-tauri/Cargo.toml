[package]
name = "zaos"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tauri = { version = "2", features = ["shell-open", "shell-execute"] }
tauri-plugin-shell = { version = "2", features = ["open"] }
notify = "6"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
async-trait = "0.1"
dashmap = "5.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
